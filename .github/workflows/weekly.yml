name: Weekly Squeeze Scan

on:
  schedule:
    # 14:00 UTC Saturday — after Friday's close, so the weekly bar is complete.
    - cron: "0 14 * * 6"
  workflow_dispatch: {}

permissions:
  contents: write          # commit out_weekly/ + weekly ledger back to the repo

concurrency:
  group: sqzdots-ledger    # share with the daily scan so repo commits serialize
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run weekly scan + weekly ledger + notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_OWNER_IDS: ${{ secrets.TELEGRAM_OWNER_IDS }}
          TELEGRAM_ALERT_CHAT_IDS: ${{ secrets.TELEGRAM_ALERT_CHAT_IDS }}
          TELEGRAM_FOOTER: ${{ vars.TELEGRAM_FOOTER }}
        run: python -m scanner.weekrun --universe universe.csv --futures futures.csv --out out_weekly

      - name: Commit weekly results + ledger
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add out_weekly/ ledger/
          git diff --staged --quiet && exit 0
          git commit -m "weekly scan results $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push rejected, retry $i"; sleep 3
          done
          echo "push failed after retries" >&2; exit 1

      - name: Alert operator on failure
        if: failure()
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d chat_id="${ADMIN}" \
            -d text="🚨 Sqzdots WEEKLY scan FAILED — ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
