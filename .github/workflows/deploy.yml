name: Deploy bot to Fly

# Manual deploy so you never need local flyctl (handy when Windows Application
# Control blocks fly.exe). Trigger from the Actions tab -> "Deploy bot to Fly"
# -> Run workflow. Needs a FLY_API_TOKEN repo secret (Fly dashboard -> Tokens).
on:
  workflow_dispatch:

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
